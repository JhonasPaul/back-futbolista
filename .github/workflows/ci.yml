name: CI/CD Pipeline

on:
  push:
    branches:
      - docker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Create Docker network
        run: |
          docker network create spring || true

      - name: Checkout database repository
        uses: actions/checkout@v3
        with:
          repository: 'JhonasPaul/mysql'
          token: ${{ secrets.GITHUB_TOKEN }}
          path: mysql

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          cd mysql
          docker-compose -f docker-compose.yml up -d

      - name: List running containers
        run: |
          docker ps

      - name: Install dockerize
        run: |
          wget https://github.com/jwilder/dockerize/releases/download/v0.6.1/dockerize-linux-amd64-v0.6.1.tar.gz
          tar -xzvf dockerize-linux-amd64-v0.6.1.tar.gz
          sudo mv dockerize /usr/local/bin/

      - name: Wait for MySQL to be ready
        run: |
          dockerize -wait tcp://172.18.0.2:3306 -timeout 120s

      - name: Run Flyway migrations
        run: |
          docker run --rm \
            -v $(pwd)/sql:/flyway/sql \
            -e FLYWAY_URL=jdbc:mysql://172.18.0.2:3306/futbolistas_db?useSSL=false&allowPublicKeyRetrieval=true \
            -e FLYWAY_USER=root \
            -e FLYWAY_PASSWORD=45549813O \
            flyway/flyway migrate
          
          
          # Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v3

      # Configura JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Construye el artefacto JAR
      - name: Build JAR
        run: |
          mvn clean package -DskipTests

      

      # Construye imagen de producción
      - name: Build Docker image for production
        run: |
          docker build -t futbolistas:latest .

      # Publica la imagen en Docker Hub
      - name: Push Docker image to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker tag futbolistas:latest jhonaspaul/futbolistas:latest
          docker push jhonaspaul/futbolistas:latest

