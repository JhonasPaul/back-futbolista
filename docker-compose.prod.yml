services:
  app:
    image: futbolistas:latest
    container_name: servicio-futbolistas
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_APP_PORT=8080
    ports:
      - ${SPRING_APP_PORT}:8080
    networks:
      - spring

networks:
  spring:
    external: true


